[package]
name = "quick-start"
version = "0.1.0"
edition = "2024"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = { version = "1.0.104" }
chrono = "0.4.45"
dotenvy = { version = "0.15.7" }
sea-orm = { version = "2.0.0", features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
  "schema-sync",
  "entity-registry",
  "with-chrono",
  "with-json",
  "debug-print",
  "serde"
] }
sea-orm-migration = { version = "2.0.4", features = [
  "runtime-tokio",
  "sqlx-postgres",
] }
tokio = { version = "1.53.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
utility-types = "0.0.4"
axum = { version = "0.8.9", features = ["macros"] }
schemars = { version = "0.9.0", features = ["indexmap2"] }
aide = { version = "0.15.1", features = [
  "axum",
  "axum-json",
  "macros",
  "swagger",
] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1"
tower-http = { version = "0.7.0", features = ["cors"] }
